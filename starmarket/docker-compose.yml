services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starmarket
      POSTGRES_USER: starmarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starmarket -d starmarket"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://starmarket:${POSTGRES_PASSWORD}@db:5432/starmarket
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  bot:
    build: .
    command: ["python", "-m", "app.bot.main"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://starmarket:${POSTGRES_PASSWORD}@db:5432/starmarket
    depends_on:
      - api
    restart: unless-stopped
volumes:
  postgres_data:
